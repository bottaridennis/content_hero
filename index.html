<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Content Hero — gestione task gamificata con XP, badge, sfide e premi." />
    <meta name="theme-color" content="#6d4aff" />
    <title>Content Hero</title>
    <link rel="icon" type="image/svg+xml" href="/content_hero/favicon.svg" />
    <script>
      // Applica il tema prima del primo paint per evitare il flash chiaro/scuro
      (function () {
        try {
          var t = localStorage.getItem('ch-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
